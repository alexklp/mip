<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}МІП — Моніторинг інформаційного простору{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_version('app.css') }}">
</head>
<body>
    <div class="app-shell">
        <div class="mobile-topbar">
            <span class="brand-mark">МІП</span>
            <button
                type="button"
                class="nav-toggle"
                aria-expanded="false"
                aria-controls="sidebar-nav"
                onclick="var s=document.getElementById('sidebar-nav'); var open=s.classList.toggle('nav-open'); this.setAttribute('aria-expanded', open);"
            >
                Меню
            </button>
        </div>
        <nav class="sidebar" id="sidebar-nav" aria-label="Основна навігація">
            <div class="brand">
                <span class="brand-mark">МІП</span>
                <span class="brand-full">Моніторинг інформаційного простору</span>
            </div>
            <div class="status-pills">
                <span class="pill">Тестова версія</span>
                <span class="pill">Лише перегляд</span>
            </div>
            <ul class="nav-list">
                <li>
                    <a class="nav-link" href="/topics" {% if active_page == "topics" %}aria-current="page"{% endif %}>Теми</a>
                </li>
                <li>
                    <a class="nav-link" href="/signals" {% if active_page == "signals" %}aria-current="page"{% endif %}>Сигнали</a>
                </li>
                <li>
                    <a class="nav-link" href="/contours" {% if active_page == "contours" %}aria-current="page"{% endif %}>Контури</a>
                </li>
                <li>
                    <a class="nav-link" href="/sources" {% if active_page == "sources" %}aria-current="page"{% endif %}>Джерела</a>
                </li>
            </ul>
        </nav>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
